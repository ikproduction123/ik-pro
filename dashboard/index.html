<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - IK-PRO.ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body class="bg-light">

    <!-- Global Loader (Sesuai Aturan 35) -->
    <div id="globalLoader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <div class="dashboard-layout">
        <!-- Sidebar (Desktop) -->
        <aside class="sidebar desktop-only">
            <div class="sidebar-header">
                <a href="index.html" class="logo">IK-PRO<span>.ID</span></a>
            </div>
            <ul class="sidebar-menu">
                <li><a href="index.html" class="active"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li><a href="invitations.html"><i class="fa-solid fa-envelope-open-text"></i> Undangan Saya</a></li>
                <li><a href="templates.html"><i class="fa-solid fa-palette"></i> Pilih Tema</a></li>
                <!-- Menu edit akan aktif ketika invitation sudah dibuat -->
                <li><a href="wishes.html"><i class="fa-solid fa-comments"></i> Ucapan</a></li>
                <li><a href="rsvp.html"><i class="fa-solid fa-clipboard-check"></i> RSVP</a></li>
                <li><a href="guests.html"><i class="fa-solid fa-users"></i> Tamu & WA</a></li>
                <li><a href="statistics.html"><i class="fa-solid fa-chart-simple"></i> Statistik</a></li>
            </ul>
            <div class="sidebar-footer">
                <button id="btnLogoutSidebar" class="btn-text"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <header class="topbar">
                <div class="topbar-left">
                    <h2 id="pageTitle">Overview</h2>
                </div>
                <div class="topbar-right">
                    <div class="user-profile">
                        <div class="avatar"><i class="fa-solid fa-user"></i></div>
                        <span id="userNameDisplay">Memuat...</span>
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <!-- Statistik Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #e8f5e9; color: var(--secondary);">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Total Undangan</h3>
                            <p id="statTotalInvitations">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #fff8e1; color: var(--gold);">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Jumlah Tamu</h3>
                            <p id="statTotalGuests">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #e3f2fd; color: #1976d2;">
                            <i class="fa-solid fa-clipboard-check"></i>
                        </div>
                        <div class="stat-info">
                            <h3>RSVP Hadir</h3>
                            <p id="statRsvp">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background-color: #fce4ec; color: #c2185b;">
                            <i class="fa-solid fa-comments"></i>
                        </div>
                        <div class="stat-info">
                            <h3>Total Ucapan</h3>
                            <p id="statWishes">0</p>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <section class="quick-actions-section">
                    <h3>Aksi Cepat</h3>
                    <div class="quick-actions-grid mt-3">
                        <a href="invitations.html" class="action-btn">
                            <i class="fa-solid fa-plus"></i>
                            <span>Buat Undangan</span>
                        </a>
                        <a href="templates.html" class="action-btn">
                            <i class="fa-solid fa-palette"></i>
                            <span>Lihat Tema</span>
                        </a>
                        <a href="#" class="action-btn" onclick="alert('Fitur segera hadir setelah undangan dibuat')">
                            <i class="fa-solid fa-share-nodes"></i>
                            <span>Share WhatsApp</span>
                        </a>
                    </div>
                </section>
            </div>
        </main>

        <!-- Bottom Navigation (Mobile Only) -->
        <nav class="mobile-nav mobile-only">
            <a href="index.html" class="active"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="invitations.html"><i class="fa-solid fa-envelope-open-text"></i><span>Undangan</span></a>
            <a href="wishes.html"><i class="fa-solid fa-comments"></i><span>Ucapan</span></a>
            <button id="btnLogoutMobile" class="nav-btn"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></button>
        </nav>
    </div>

    <!-- Script -->
    <script type="module" src="../assets/js/dashboard.js"></script>
</body>
</html>
