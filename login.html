<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - IK-PRO.ID</title>
<meta name="description" content="Login ke akun IK-PRO.ID">

<link rel="stylesheet" href="assets/css/auth.css">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head><body><main class="auth-page">

    <section class="auth-card">

        <div class="auth-logo">
            <div class="logo-icon">IK</div>
            <div class="logo-text">
                <strong>IK-PRO</strong>
                <span>.MY.ID</span>
            </div>
        </div>

        <div class="auth-header">
            <h1>Selamat Datang 👋</h1>
            <p>Masuk ke akun IK-PRO.ID Anda</p>
        </div>

        <form id="loginForm" class="auth-form">

            <div class="form-group">
                <label for="loginEmail">Email</label>

                <div class="input-wrapper">
                    <span class="input-icon">✉</span>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Masukkan email"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>

                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="loginPassword"
                        aria-label="Tampilkan password"
                    >
                        👁
                    </button>
                </div>
            </div>

            <div id="loginMessage" class="form-message"></div>

            <button type="submit" id="loginButton" class="auth-button">
                <span class="button-text">Masuk</span>
                <span class="button-loading">Memproses...</span>
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Belum punya akun?
                <a href="register.html">Daftar sekarang</a>
            </p>
        </div>

    </section>

</main>

<script src="assets/js/auth.js"></script>

</body>
</html>
