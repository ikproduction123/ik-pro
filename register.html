<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar IK-PRO.ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <h2>Daftar Akun Baru</h2>
        <p>Bergabunglah untuk membuat undangan digital Anda</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Nama Lengkap</label>
                <input type="text" id="name" class="form-control" placeholder="Contoh: Budi Santoso" required>
            </div>
            <div class="form-group">
                <label for="phone">No. WhatsApp</label>
                <input type="tel" id="phone" class="form-control" placeholder="Contoh: 08123456789" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Minimal 6 karakter" required minlength="6">
            </div>
            <button type="submit" class="btn-primary" id="btnSubmit">Daftar Sekarang</button>
        </form>

        <div class="auth-links">
            Sudah punya akun? <a href="login.html">Masuk di sini</a>
        </div>
    </div>

    <!-- Script Utama (Menggunakan Module agar bisa import) -->
    <script type="module" src="assets/js/register.js"></script>
</body>
</html>
