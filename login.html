<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - IK-PRO.ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <h2>Selamat Datang Kembali</h2>
        <p>Masuk ke akun IK-PRO.ID Anda</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Masukkan password Anda" required>
            </div>
            <button type="submit" class="btn-primary" id="btnSubmit">Masuk</button>
        </form>

        <div class="auth-links">
            Belum punya akun? <a href="register.html">Daftar sekarang</a>
        </div>
    </div>

    <!-- Script Utama -->
    <script type="module" src="assets/js/login.js"></script>
</body>
</html>
