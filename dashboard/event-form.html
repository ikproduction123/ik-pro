<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Acara - IK-PRO.ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/crud.css">
</head>
<body class="bg-light">

    <div id="globalLoader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <div class="dashboard-layout">
        <aside class="sidebar desktop-only">
            <div class="sidebar-header">
                <a href="index.html" class="logo">IK-PRO<span>.ID</span></a>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" id="btnBackSidebar"><i class="fa-solid fa-arrow-left"></i> Kembali</a></li>
            </ul>
        </aside>

        <main class="dashboard-main">
            <header class="topbar">
                <div class="topbar-left">
                    <h2 id="pageTitle">Tambah Acara</h2>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="form-container">
                    <form id="eventForm">
                        <div class="form-group">
                            <label>Nama Acara</label>
                            <input type="text" id="name" class="form-control" placeholder="Contoh: Akad Nikah / Resepsi" required>
                        </div>
                        <div class="form-group">
                            <label>Tanggal Acara</label>
                            <input type="date" id="date" class="form-control" required>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                            <div class="form-group">
                                <label>Jam Mulai</label>
                                <input type="time" id="start_time" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Jam Selesai</label>
                                <input type="time" id="end_time" class="form-control">
                                <span class="help-text">Kosongkan jika 'Selesai'</span>
                            </div>
                            <div class="form-group">
                                <label>Zona Waktu</label>
                                <select id="timezone" class="form-control" required>
                                    <option value="WIB">WIB</option>
                                    <option value="WITA">WITA</option>
                                    <option value="WIT">WIT</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Nama Lokasi/Gedung</label>
                            <input type="text" id="location_name" class="form-control" placeholder="Contoh: Gedung Serbaguna / Kediaman Mempelai Wanita" required>
                        </div>
                        <div class="form-group">
                            <label>Alamat Lengkap</label>
                            <textarea id="address" class="form-control" rows="3" placeholder="Jl. Contoh No. 123, Kelurahan, Kecamatan, Kota" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Link Google Maps</label>
                            <input type="url" id="google_maps_url" class="form-control" placeholder="https://goo.gl/maps/...">
                        </div>

                        <div class="form-actions mt-3">
                            <button type="submit" class="btn-primary" id="btnSubmit">Simpan Acara</button>
                            <a href="#" id="btnCancel" class="btn-outline" style="margin-left: 10px;">Batal</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../assets/js/event-form.js"></script>
</body>
</html>
