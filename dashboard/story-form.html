<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Cerita Cinta - IK-PRO.ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/crud.css">
</head>
<body class="bg-light">
    <div id="globalLoader" class="loader-overlay"><div class="spinner"></div></div>
    <div class="dashboard-layout">
        <aside class="sidebar desktop-only">
            <div class="sidebar-header"><a href="index.html" class="logo">IK-PRO<span>.ID</span></a></div>
            <ul class="sidebar-menu">
                <li><a href="#" id="btnBackSidebar"><i class="fa-solid fa-arrow-left"></i> Kembali</a></li>
            </ul>
        </aside>
        <main class="dashboard-main">
            <header class="topbar"><div class="topbar-left"><h2 id="pageTitle">Tambah Cerita</h2></div></header>
            <div class="dashboard-content">
                <div class="form-container">
                    <form id="storyForm">
                        <div class="form-group">
                            <label>Judul / Momen (Contoh: Pertama Bertemu)</label>
                            <input type="text" id="title" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Tanggal / Tahun Kejadian</label>
                            <input type="date" id="date" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Isi Cerita</label>
                            <textarea id="story" class="form-control" rows="4" placeholder="Ceritakan detail momen tersebut..." required></textarea>
                        </div>
                        <div class="form-actions mt-3">
                            <button type="submit" class="btn-primary" id="btnSubmit">Simpan Cerita</button>
                            <a href="#" id="btnCancel" class="btn-outline" style="margin-left: 10px;">Batal</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="../assets/js/story-form.js"></script>
</body>
</html>
