<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Foto Galeri - IK-PRO.ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/crud.css">
</head>
<body class="bg-light">
    <div id="globalLoader" class="loader-overlay"><div class="spinner"></div></div>
    <div class="dashboard-layout">
        <aside class="sidebar desktop-only">
            <div class="sidebar-header"><a href="index.html" class="logo">IK-PRO<span>.ID</span></a></div>
            <ul class="sidebar-menu">
                <li><a href="#" id="btnBackSidebar"><i class="fa-solid fa-arrow-left"></i> Kembali</a></li>
            </ul>
        </aside>
        <main class="dashboard-main">
            <header class="topbar"><div class="topbar-left"><h2>Tambah Foto Galeri</h2></div></header>
            <div class="dashboard-content">
                <div class="form-container">
                    <form id="galleryForm">
                        <div class="form-group">
                            <label>Pilih Foto</label>
                            <input type="file" id="image" class="form-control" accept="image/jpeg, image/png, image/webp" required>
                            <span class="help-text">Format: JPG, PNG, WEBP. Maks 2MB.</span>
                            <img id="img_preview" style="width: 200px; height: 150px; object-fit: cover; margin-top: 10px; display: none; border-radius: var(--radius);" alt="Preview">
                        </div>
                        <div class="form-group">
                            <label>Keterangan / Caption (Opsional)</label>
                            <input type="text" id="caption" class="form-control" placeholder="Contoh: Sesi Prewedding di Pantai">
                        </div>
                        <div class="form-actions mt-3">
                            <button type="submit" class="btn-primary" id="btnSubmit">Upload Foto</button>
                            <a href="#" id="btnCancel" class="btn-outline" style="margin-left: 10px;">Batal</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="../assets/js/gallery-form.js"></script>
</body>
</html>
