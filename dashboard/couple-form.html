<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Mempelai - IK-PRO.ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/crud.css">
    <style>
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .form-section-title {
            color: var(--primary);
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .img-preview {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: var(--radius);
            margin-top: 10px;
            border: 1px solid var(--border);
            display: none;
        }
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="bg-light">

    <div id="globalLoader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <div class="dashboard-layout">
        <aside class="sidebar desktop-only">
            <div class="sidebar-header">
                <a href="index.html" class="logo">IK-PRO<span>.ID</span></a>
            </div>
            <ul class="sidebar-menu">
                <li><a href="invitations.html"><i class="fa-solid fa-arrow-left"></i> Kembali</a></li>
            </ul>
        </aside>

        <main class="dashboard-main">
            <header class="topbar">
                <div class="topbar-left">
                    <h2>Data Mempelai</h2>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="form-container" style="max-width: 900px;">
                    <form id="coupleForm">
                        <div class="form-grid">
                            <!-- BAGIAN MEMPELAI WANITA (BRIDE) -->
                            <div class="form-section">
                                <h3 class="form-section-title"><i class="fa-solid fa-person-dress"></i> Mempelai Wanita</h3>
                                
                                <div class="form-group">
                                    <label>Nama Panggilan</label>
                                    <input type="text" id="bride_short_name" class="form-control" placeholder="Contoh: Anisa" required>
                                </div>
                                <div class="form-group">
                                    <label>Nama Lengkap</label>
                                    <input type="text" id="bride_full_name" class="form-control" placeholder="Contoh: Anisa Putri" required>
                                </div>
                                <div class="form-group">
                                    <label>Nama Bapak</label>
                                    <input type="text" id="bride_father" class="form-control" placeholder="Bapak Budi">
                                </div>
                                <div class="form-group">
                                    <label>Nama Ibu</label>
                                    <input type="text" id="bride_mother" class="form-control" placeholder="Ibu Siti">
                                </div>
                                <div class="form-group">
                                    <label>Username Instagram</label>
                                    <input type="text" id="bride_instagram" class="form-control" placeholder="Contoh: @anisaputri">
                                </div>
                                <div class="form-group">
                                    <label>Foto Mempelai Wanita</label>
                                    <input type="file" id="bride_photo" class="form-control" accept="image/jpeg, image/png, image/webp">
                                    <span class="help-text">Format: JPG, PNG, WEBP. Maks 2MB.</span>
                                    <img id="bride_preview" class="img-preview" alt="Preview Wanita">
                                </div>
                            </div>

                            <!-- BAGIAN MEMPELAI PRIA (GROOM) -->
                            <div class="form-section">
                                <h3 class="form-section-title"><i class="fa-solid fa-person"></i> Mempelai Pria</h3>
                                
                                <div class="form-group">
                                    <label>Nama Panggilan</label>
                                    <input type="text" id="groom_short_name" class="form-control" placeholder="Contoh: Bagas" required>
                                </div>
                                <div class="form-group">
                                    <label>Nama Lengkap</label>
                                    <input type="text" id="groom_full_name" class="form-control" placeholder="Contoh: Bagas Saputra" required>
                                </div>
                                <div class="form-group">
                                    <label>Nama Bapak</label>
                                    <input type="text" id="groom_father" class="form-control" placeholder="Bapak Andi">
                                </div>
                                <div class="form-group">
                                    <label>Nama Ibu</label>
                                    <input type="text" id="groom_mother" class="form-control" placeholder="Ibu Rina">
                                </div>
                                <div class="form-group">
                                    <label>Username Instagram</label>
                                    <input type="text" id="groom_instagram" class="form-control" placeholder="Contoh: @bagassaputra">
                                </div>
                                <div class="form-group">
                                    <label>Foto Mempelai Pria</label>
                                    <input type="file" id="groom_photo" class="form-control" accept="image/jpeg, image/png, image/webp">
                                    <span class="help-text">Format: JPG, PNG, WEBP. Maks 2MB.</span>
                                    <img id="groom_preview" class="img-preview" alt="Preview Pria">
                                </div>
                            </div>
                        </div>

                        <div class="form-actions mt-3" style="border-top: 1px solid var(--border); padding-top: 20px;">
                            <button type="submit" class="btn-primary" id="btnSubmit">Simpan Data Mempelai</button>
                            <a href="invitations.html" class="btn-outline" style="margin-left: 10px;">Batal</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../assets/js/couple-form.js"></script>
</body>
</html>
