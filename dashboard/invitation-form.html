<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Undangan - IK-PRO.ID</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/crud.css">
</head>
<body class="bg-light">

    <div id="globalLoader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <div class="dashboard-layout">
        <!-- Sidebar disingkat untuk form (Tetap konsisten dengan layout) -->
        <aside class="sidebar desktop-only">
            <div class="sidebar-header">
                <a href="index.html" class="logo">IK-PRO<span>.ID</span></a>
            </div>
            <ul class="sidebar-menu">
                <li><a href="invitations.html"><i class="fa-solid fa-arrow-left"></i> Kembali</a></li>
            </ul>
        </aside>

        <main class="dashboard-main">
            <header class="topbar">
                <div class="topbar-left">
                    <h2 id="pageTitle">Buat Undangan Baru</h2>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="form-container">
                    <form id="invitationForm">
                        <div class="form-group">
                            <label for="title">Judul Undangan</label>
                            <input type="text" id="title" class="form-control" placeholder="Contoh: The Wedding Of" required>
                        </div>
                        <div class="form-group">
                            <label for="slug">URL Undangan (Slug)</label>
                            <input type="text" id="slug" class="form-control" placeholder="contoh: anisa-bagas" required>
                            <span class="help-text">URL nantinya: https://ik-pro.my.id/<strong id="slugPreview">...</strong>/</span>
                        </div>
                        <div class="form-actions mt-3">
                            <button type="submit" class="btn-primary" id="btnSubmit">Simpan Undangan</button>
                            <a href="invitations.html" class="btn-outline" style="margin-left: 10px;">Batal</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../assets/js/invitation-form.js"></script>
</body>
</html>
